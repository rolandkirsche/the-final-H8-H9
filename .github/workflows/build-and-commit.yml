name: Build generated site

# Baut index.html aus src/ und committet sie, wenn sie sich geändert hat.
# Lokal muss deshalb niemand esbuild installieren; GitHub Pages zeigt danach die neue Fassung.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Zwei schnell aufeinanderfolgende Pushes sollen sich beim Zurückschreiben nicht in die Quere kommen
concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Version fest, damit die Minifizierung Byte für Byte reproduzierbar ist
      - run: npm install -g esbuild@0.28.2
      - run: python3 build.py
      - name: Commit generated index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'index.html is already current.'
            exit 0
          fi
          git add index.html
          git commit -m 'Build generated index.html'
          git push
